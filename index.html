<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partenaires Amicale — Accès</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-box {
      text-align: center;
      padding: 24px;
      max-width: 320px;
      width: 100%;
    }
    .login-box img {
      max-width: 220px;
      width: 100%;
      height: auto;
      margin-bottom: 24px;
    }
    .login-box input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      cursor: pointer;
    }
    #erreur {
      color: #c0392b;
      margin-top: 12px;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <img src="image.png" alt="Logo de l'Amicale">
    <form id="loginForm" onsubmit="return verifierMotDePasse();">
      <input type="password" id="motDePasse" placeholder="Mot de passe" autofocus>
      <button type="submit">Accéder au site</button>
    </form>
    <p id="erreur"></p>
  </div>

  <script>
    const MOT_DE_PASSE = "gmva";

    function verifierMotDePasse() {
      const saisie = document.getElementById("motDePasse").value.trim();
      const erreurEl = document.getElementById("erreur");

      if (saisie === MOT_DE_PASSE) {
        // Mémorise l'accès pour le reste de la session de navigation, et ajoute
        // aussi "?auth=1" dans l'URL pour que ça marche même si le stockage
        // n'est pas partagé entre les deux pages (cas de certains navigateurs
        // en ouverture locale des fichiers, sans serveur web).
        sessionStorage.setItem("gmva_auth", "ok");
        window.location.href = "modal_menu.html?auth=1";
      } else {
        erreurEl.textContent = "Mot de passe incorrect.";
        document.getElementById("motDePasse").value = "";
        document.getElementById("motDePasse").focus();
      }
      return false; // empêche le rechargement de la page par le formulaire
    }
  </script>

</body>
</html>
